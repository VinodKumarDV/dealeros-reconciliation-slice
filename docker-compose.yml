services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dealeros
      POSTGRES_USER: dealeros_admin
      POSTGRES_PASSWORD: dealeros_admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealeros_app -d dealeros"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  backend:
    build: ./backend
    environment:
      POSTGRES_DB: dealeros
      POSTGRES_USER: dealeros_app
      POSTGRES_PASSWORD: dealeros_local
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "python -c \"from seed import ensure_schema_and_seed; ensure_schema_and_seed()\" && uvicorn app:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
